<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園自然觀察任務卡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #071812, #123524);
            color: #f5fff8;
        }

        .container {
            width: min(900px, 90%);
            margin: auto;
            padding: 60px 0;
        }

        .back {
            color: #86efac;
            text-decoration: none;
        }

        .hero {
            margin-top: 30px;
            padding: 45px;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .tag {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 30px;
            background: #4ade80;
            color: #052e16;
            font-weight: bold;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            margin: 20px 0;
        }

        .intro {
            color: #c7f9d7;
            font-size: 18px;
            line-height: 1.9;
        }

        .task {
            margin-top: 22px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.07);
            border-left: 5px solid #4ade80;
        }

        h2 {
            color: #86efac;
        }

        p {
            line-height: 2;
            color: #d8fbe2;
        }

        .media-box {
            padding: 25px;
            margin-top: 18px;
            border-radius: 15px;
            background: rgba(74,222,128,0.1);
            text-align: center;
        }

        .media-box span {
            font-size: 45px;
        }

        footer {
            text-align: center;
            color: #86a894;
            margin-top: 45px;
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="index.html">← 回到作品集</a>

    <section class="hero">
        <span class="tag">HTML 實作練習 02</span>

        <h1>🌿 校園自然觀察任務卡</h1>

        <p class="intro">
            今天我們用眼睛觀察，也用文字記錄發現。
        </p>
    </section>

    <section class="task">
        <h2>🔎 任務一：看看葉脈</h2>

        <p>
            觀察葉片圖片，找出葉脈延伸的方向。
        </p>

        <div class="media-box">
            <span>🍃</span>
            <p>葉片觀察區</p>
        </div>
    </section>

    <section class="task">
        <h2>🔊 任務二：準備開始</h2>

        <p>
            按下播放，聽到三個由低到高的短音後，
            開始你的觀察。
        </p>

        <div class="media-box">
            <span>▶️</span>
            <p>音訊播放區</p>
        </div>
    </section>

    <section class="task">
        <h2>🌸 任務三：觀察花朵</h2>

        <p>
            播放短片，看看花朵怎麼移動，
            再用一句話描述。
        </p>

        <div class="media-box">
            <span>🎬</span>
            <p>影片觀察區</p>
        </div>
    </section>

    <footer>
        HTML 實作練習 · 02
    </footer>

</div>

</body>
</html>
