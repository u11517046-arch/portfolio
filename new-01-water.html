<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水與生活｜小小科學探索日</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #07111f, #102a43);
            color: #f5f7fa;
            min-height: 100vh;
        }

        .container {
            width: min(900px, 90%);
            margin: auto;
            padding: 60px 0;
        }

        .back {
            display: inline-block;
            color: #8fd3ff;
            text-decoration: none;
            margin-bottom: 30px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .hero {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 45px;
            margin-bottom: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .tag {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 30px;
            background: #38bdf8;
            color: #06111f;
            font-weight: bold;
            font-size: 14px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 52px);
            margin: 20px 0 12px;
        }

        .subtitle {
            font-size: 19px;
            color: #b9d7ec;
            line-height: 1.8;
        }

        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
        }

        h2 {
            color: #7dd3fc;
            margin-top: 0;
        }

        p {
            color: #dbeafe;
            line-height: 2;
            font-size: 17px;
        }

        .formula {
            display: inline-block;
            background: rgba(56,189,248,0.15);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            color: #7dd3fc;
        }

        .slogan {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            background: rgba(56,189,248,0.12);
        }

        .footer {
            text-align: center;
            color: #8fa8bb;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="index.html">← 回到作品集</a>

    <section class="hero">
        <span class="tag">HTML 實作練習 01</span>

        <h1>💧 水與生活：<br>小小科學探索日</h1>

        <p class="subtitle">
            一起從生活中的水，發現科學的有趣之處。
        </p>
    </section>

    <section class="card">
        <h2>🔬 活動介紹</h2>
        <p>
            這次活動適合國小中年級學生，
            請帶著好奇心一起參加。
        </p>
    </section>

    <section class="card">
        <h2>👀 觀察水的樣子</h2>
        <p>
            看看不同容器中的水，
            試著說出你觀察到的變化。
        </p>
    </section>

    <section class="card">
        <h2>🧪 認識水的名字</h2>
        <p>水的化學式是：</p>

        <div class="formula">
            H<sub>2</sub>O
        </div>
    </section>

    <section class="card">
        <h2>🎒 參加前的小提醒</h2>

        <p>
            請自備水壺，並準備一本觀察筆記。
        </p>

        <div class="slogan">
            「先觀察，再提問！」 🔍
        </div>

        <p>
            我們將使用面積為
            <strong>100 cm<sup>2</sup></strong>
            的方形觀察卡。
        </p>
    </section>

    <div class="footer">
        HTML 實作練習 · 01
    </div>

</div>

</body>
</html>
