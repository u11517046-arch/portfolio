<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的學習計畫</title>
  <!-- 老師預先提供表格框線，方便辨認儲存格；本活動不用修改 CSS。 -->
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #777; padding: 8px; text-align: left; }
    caption { text-align: left; font-weight: bold; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>我的學習計畫</h1>
  <p>我是小安，這學期想把自己的點子做成可以分享的作品。</p>

  <h2>我想學的技能</h2>
  <ul>
    <li>網頁設計</li>
    <li>圖片編輯</li>
    <li>聲音錄製</li>
  </ul>

  <h2>我準備怎麼做</h2>
  <ol>
    <li>選一個想介紹的主題</li>
    <li>整理文字和圖片</li>
    <li>製作網頁並請同學試看</li>
  </ol>

  <h2>我的實作安排</h2>
  <table>
    <caption>技能與成果對照</caption>
    <thead>
      <tr>
        <th scope="col">想學的技能</th>
        <th scope="col">練習任務</th>
        <th scope="col">預計成果</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>網頁設計</td>
        <td>修改標題與自我介紹</td>
        <td>一頁個人介紹</td>
      </tr>
      <tr>
        <td>圖片編輯</td>
        <td>挑選並整理作品圖片</td>
        <td>三張作品配圖</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
